name: mindlock
description: "MindLock - Your Digital Wellness Guardian. Control social media usage and protect your focus."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Storage & Persistence
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # State Management
  provider: ^6.1.2

  # Dependency Injection
  get_it: ^8.0.2

  # UI & Charts
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  animated_text_kit: ^4.2.3
  percent_indicator: ^4.2.3
  lottie: ^3.1.3

  # System & Permissions
  permission_handler: ^11.3.1
  app_usage: ^4.1.0 # Updated version
  installed_apps: ^1.3.2

  # Background & Notifications
  flutter_local_notifications: ^17.2.4
  workmanager: 0.9.0+3

  # Device Features
  volume_controller: 3.4.4
  wakelock_plus: ^1.2.10
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # Note: Ensure these assets exist in your project
  assets:
    - assets/reels_block_banner.png

  # fonts:
